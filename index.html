<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iron Nomad: Road to Haven</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1612'/%3E%3Ccircle cx='9' cy='22' r='4' fill='none' stroke='%23ffb454' stroke-width='2.5'/%3E%3Ccircle cx='23' cy='22' r='4' fill='none' stroke='%23ffb454' stroke-width='2.5'/%3E%3Cpath d='M9 22 L15 12 H20 L23 22 M13 12 L11 9 H8' fill='none' stroke='%23ffb454' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The web fonts never hold up the first paint: the stylesheet applies once it arrives, and text swaps in. -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" /></noscript>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0907; }
      #splash { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; color: #e9dfc7; font-family: 'Oswald', 'Bahnschrift', 'Arial Narrow', 'Franklin Gothic Medium', Impact, sans-serif; text-transform: uppercase; pointer-events: none; }
      #splash b { display: block; font-size: 78px; font-weight: 500; letter-spacing: 0.22em; color: #ffb454; text-shadow: 0 0 24px rgba(255, 140, 40, 0.35), 0 4px 0 #000; line-height: 1; }
      #splash i { display: block; font-style: normal; font-size: 30px; letter-spacing: 0.6em; padding-left: 0.6em; margin-top: 6px; }
      #splash small { display: block; margin-top: 34px; font: 12px 'Share Tech Mono', ui-monospace, Menlo, monospace; letter-spacing: 0.3em; color: #b97d2c; }
    </style>
  </head>
  <body>
    <!-- Painted before any script has loaded; the title replaces it as soon as the game is up. -->
    <div id="splash"><div><b>IRON NOMAD</b><i>ROAD TO HAVEN</i><small>LOADING</small></div></div>
    <canvas id="gl"></canvas>
    <div id="ui">
      <div class="half" id="half0"></div>
      <div class="half" id="half1"></div>
      <div id="divider"></div>
      <div id="overlay"></div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
