<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Udud &amp; Nuhat's house</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #262c28; color: #f5f0e6; font: 14px/1.5 system-ui, sans-serif; }
      #gl { display: block; width: 100%; height: 100%; touch-action: none; }
      header { position: absolute; top: 20px; left: 24px; padding: 10px 14px; border-radius: 10px; background: #202822c9; pointer-events: none; text-shadow: 0 2px 10px #0005; }
      .eyebrow { color: #edb580; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
      h1 { font-size: 36px; font-weight: 650; margin: 2px 0 0; letter-spacing: -.035em; }
      .details { color: #deded4; font-size: 13px; }
      #controls { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; padding: 7px; border: 1px solid #ffffff22; border-radius: 12px; background: #202822e8; box-shadow: 0 8px 30px #0004; }
      button, a { color: #e6e8de; background: transparent; border: 0; border-radius: 7px; padding: 9px 13px; font: inherit; white-space: nowrap; cursor: pointer; text-decoration: none; }
      button:hover, a:hover { background: #ffffff16; }
      button[aria-pressed="true"] { background: #d77a36; color: #171a15; }
      button:focus-visible, a:focus-visible { outline: 2px solid #efb67e; outline-offset: 2px; }
      #back { position: absolute; top: 28px; right: 26px; background: #202822cc; border: 1px solid #ffffff22; }
      #hint { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); color: #deded3; font-size: 12px; text-shadow: 0 1px 8px #000; pointer-events: none; white-space: nowrap; }
      @media (max-width: 650px) {
        header { top: 18px; left: 18px; } h1 { font-size: 28px; }
        #back { top: 19px; right: 16px; font-size: 12px; }
        #controls { bottom: 16px; gap: 1px; padding: 5px; max-width: calc(100% - 20px); flex-wrap: wrap; justify-content: center; }
        button, a { padding: 7px 9px; font-size: 12px; }
        #hint { bottom: 105px; }
      }
    </style>
  </head>
  <body>
    <canvas id="gl" aria-label="Interactive 3D scene of Udud and Nuhat's house and garden barbecue, Amirat at the grill"></canvas>
    <header><div class="eyebrow">North of Petah Tikva</div><h1>Udud &amp; Nuhat's house</h1><div class="details">The family barbecue · Amirat at the grill</div></header>
    <a id="back" href="/">Back to game ↗</a>
    <div id="hint">Drag to look around · Scroll to zoom</div>
    <nav id="controls" aria-label="Scene controls">
      <button id="garden" aria-pressed="true">Garden</button>
      <button id="photo" aria-pressed="false">Photo view</button>
      <button id="table" aria-pressed="false">Party table</button>
      <button id="passage" aria-pressed="false">Passage</button>
      <button id="front" aria-pressed="false">Front gate</button>
      <button id="drive" aria-pressed="false">Driveway</button>
      <button id="cover" aria-pressed="false">Hide cover</button>
      <a href="/portrait.html?hero=amirat&kit=shirt&view=face">Portrait ↗</a>
      <button id="light" aria-pressed="false">Daylight</button>
      <button id="pause" aria-pressed="false">Pause</button>
    </nav>
    <script type="module" src="/src/tools/garden.ts"></script>
  </body>
</html>
